server:
  port: 8511


spring:
  application:
    name: market-vitro-front
  servlet:
    multipart:
      max-file-size: 20480 KB

  web:
    resources:
      static-locations: classpath:./static,file:C:/opt/market/,file:C:/opt/market/images/
  mvc:
    static-path-pattern: /**



  r2dbc:
    url: r2dbc:postgresql://192.168.2.200:5432  # URL подключения к базе данных
    username: postgres                              # Имя пользователя базы данных
    password: 123




  security:
    oauth2:
      client:
        registration:
          keycloak:
            # Указываем провайдера, должно совпадать с тем, что указано в
            # oauth2Client.setDefaultClientRegistrationId
            provider: keycloak
            client-id: _a-front-vitro
            # Тут указываем токен из Client credentials из Keycloak
            client-secret: Aq8t01DeUxjTo4HfI6XbxIDvThu32jXK
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            # Указываем полный путь до нашего Realm в Keycloak
            issuer-uri: http://192.168.2.200:8282/realms/absolute
  thymeleaf:
    # Включаем поддержку Thymeleaf
    enabled: true
    mode: HTML
    # Указываем кодировку для наших html-файлов
    encoding: UTF-8
    servlet:
      content-type: text/html;charset=UTF-8



oauth:
  data:
    host: http://localhost:8521

