server:
  port: 8502

spring:
  application:
    name: payments

  data:
    redis:
      port: 6379
      host: 192.168.2.100
  cache:
    redis:
      time-to-live: PT1H



springdoc:
  api-docs:
    path: /swagger/api-docs
  swagger-ui:
    enabled: true
    path: /swagger/index.html

management:
  endpoints:
    health.probes.enabled: true
    health.show-details: always
    health:
      group:
        readiness:
          include=readinessState,indicator: true
          show-details: always

    web:
      exposure:
        include: mappings

